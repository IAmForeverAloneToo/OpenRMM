name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please check the [roadmap](https://github.com/IAmForeverAloneToo/OpenRMM/blob/main/ROADMAP.md) and existing issues first.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and why the current behaviour falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working, in the dashboard and on devices.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
